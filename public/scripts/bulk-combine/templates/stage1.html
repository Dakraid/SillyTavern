<!--
    Stage 1 template — Character Selection & Setup.
    HTML fragment rendered into #bcw_stage_1 by Stage1Characters.

    Progressive disclosure: essential controls (character strip, group name,
    prompt) are always visible; advanced options live in a collapsible section
    that is collapsed by default.

    Sections:
      1. Character card strip (horizontal scroll) + add-character search
      2. Group name input
      3. Combine prompt textarea + preset toolbar
      4. Collapsible Advanced Options (included fields, concurrency, lorebook,
         fallback tags, XML minify, crop strategy + padding)
    See DESIGN doc (Stage 1) for layout details.
-->
<div class="bcw-stage1">

    <!-- 1. Character card strip: horizontal scrollable row of draggable cards -->
    <div class="bcw-character-strip" id="bcw_character_strip" role="list" aria-label="Selected characters"></div>

    <div class="bcw-add-character">
        <input
            id="bcw_character_search"
            class="text_pole"
            type="text"
            placeholder="Search characters..."
            data-i18n="[placeholder]Search characters..."
        />
        <div id="bcw_available_list" class="bcw-available-list"></div>
    </div>

    <!-- 2. Group name -->
    <label for="bcw_group_name" class="text_label">
        <span data-i18n="Group name">Group name</span>
        <input id="bcw_group_name" class="text_pole" type="text" autocomplete="off" />
    </label>

    <!-- 3. Combine prompt + preset toolbar -->
    <label for="bcw_prompt" class="text_label">
        <span data-i18n="Prompt">Prompt</span>
        <textarea id="bcw_prompt" class="text_pole" rows="12"></textarea>
    </label>
    <div class="bcw-preset-controls">
        <select id="bcw_prompt_preset_select" class="text_pole">
            <option value="" data-i18n="— Load preset —">— Load preset —</option>
        </select>
        <div id="bcw_prompt_preset_save" class="menu_button" title="Save preset" data-i18n="[title]Save preset">
            <i class="fa-solid fa-floppy-disk"></i>
        </div>
        <div id="bcw_prompt_preset_delete" class="menu_button" title="Delete preset" data-i18n="[title]Delete preset">
            <i class="fa-solid fa-trash-can"></i>
        </div>
        <div id="bcw_prompt_preset_restore" class="menu_button" title="Restore default" data-i18n="[title]Restore default">
            <i class="fa-solid fa-rotate-left"></i>
        </div>
    </div>

    <!-- 4. Advanced Options (collapsed by default) -->
    <div class="bcw-collapsible" id="bcw_advanced_options">
        <div class="bcw-collapsible-header" id="bcw_advanced_options_header" tabindex="0" role="button" aria-expanded="false">
            <i class="fa-solid fa-chevron-right bcw-collapsible-chevron"></i>
            <span data-i18n="Advanced Options">Advanced Options</span>
        </div>
        <div class="bcw-collapsible-content" hidden>

            <!-- Included fields checkbox group -->
            <div class="bcw-field-group">
                <span class="bcw-label" data-i18n="Included fields">Included fields</span>
                <div id="bcw_included_fields" class="bcw-checkbox-group">
                    <label class="checkbox_label">
                        <input type="checkbox" id="bcw_field_personality" data-field="personality" />
                        <span data-i18n="Personality">Personality</span>
                    </label>
                    <label class="checkbox_label">
                        <input type="checkbox" id="bcw_field_scenario" data-field="scenario" />
                        <span data-i18n="Scenario">Scenario</span>
                    </label>
                    <label class="checkbox_label">
                        <input type="checkbox" id="bcw_field_first_mes" data-field="first_mes" />
                        <span data-i18n="First message">First message</span>
                    </label>
                    <label class="checkbox_label">
                        <input type="checkbox" id="bcw_field_mes_example" data-field="mes_example" />
                        <span data-i18n="Example messages">Example messages</span>
                    </label>
                </div>
            </div>

            <!-- Max concurrency -->
            <label for="bcw_concurrency" class="text_label">
                <span data-i18n="Max concurrency">Max concurrency</span>
                <input id="bcw_concurrency" class="text_pole" type="number" min="1" max="50" value="10" />
            </label>

            <!-- Lorebook radio group: None / Static / Dynamic -->
            <div class="bcw-field-group">
                <span class="bcw-label" data-i18n="Lorebook">Lorebook</span>
                <div class="bcw-radio-group" id="bcw_lorebook_group">
                    <label class="checkbox_label">
                        <input type="radio" name="bcw_lorebook" value="none" checked />
                        <span data-i18n="None">None</span>
                    </label>
                    <label class="checkbox_label">
                        <input type="radio" name="bcw_lorebook" value="static" />
                        <span data-i18n="Static">Static</span>
                    </label>
                    <label class="checkbox_label">
                        <input type="radio" name="bcw_lorebook" value="dynamic" />
                        <span data-i18n="Dynamic">Dynamic</span>
                    </label>
                </div>
            </div>

            <!-- Summary fallback tags -->
            <label for="bcw_fallback_tags" class="text_label">
                <span data-i18n="Summary fallback tags (comma-separated)">Summary fallback tags (comma-separated)</span>
                <input id="bcw_fallback_tags" class="text_pole" type="text" />
            </label>

            <!-- XML minify checkboxes -->
            <div class="bcw-field-group" id="bcw_minify_section">
                <label class="checkbox_label" for="bcw_minify">
                    <input type="checkbox" id="bcw_minify" />
                    <span data-i18n="Minify XML output">Minify XML output</span>
                </label>
                <label class="checkbox_label" for="bcw_minify_single_line" id="bcw_minify_single_line_label">
                    <input type="checkbox" id="bcw_minify_single_line" />
                    <span data-i18n="Single line">Single line</span>
                </label>
            </div>

            <!-- Crop strategy dropdown + padding slider -->
            <div class="bcw-field-group" id="bcw_crop_controls">
                <label for="bcw_crop_strategy" class="text_label">
                    <span data-i18n="Crop strategy">Crop strategy</span>
                    <select id="bcw_crop_strategy" class="text_pole">
                        <option value="attention" data-i18n="Attention (auto)">Attention (auto)</option>
                        <option value="entropy" data-i18n="Entropy">Entropy</option>
                        <option value="center" data-i18n="Center">Center</option>
                        <option value="top" data-i18n="Top">Top</option>
                        <option value="face" data-i18n="Face (heuristic)">Face (heuristic)</option>
                    </select>
                </label>
                <label for="bcw_crop_padding" class="text_label">
                    <span data-i18n="Crop padding">Crop padding</span>
                    <span class="bcw-slider-value"><span id="bcw_crop_padding_value">15</span>%</span>
                    <input id="bcw_crop_padding" type="range" min="0" max="50" value="15" />
                </label>
            </div>

        </div>
    </div>

</div>
