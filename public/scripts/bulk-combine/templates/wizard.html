<!--
    Wizard shell template — Bulk Card Combine.
    HTML fragment injected into the generic popup body. Contains the header,
    the stepper bar, the per-stage content hosts, and the footer action
    buttons. Stage modules render into #bcw_stage_1 .. #bcw_stage_5.

    CSS class names follow the `.bcw-` convention (see styles.css).
    IDs follow the `bcw_` naming convention.
    Loaded by WizardController.open (TASK-02).
-->
<div class="bcw">
    <!-- Header -->
    <div class="bcw-header">
        <h3 data-i18n="Combine into Group Card">Combine into Group Card</h3>
    </div>

    <!-- Stepper: 5 stage indicator nodes connected by lines -->
    <div class="bcw-stepper" id="bcw_stepper" role="tablist" aria-label="Wizard stages">
        <div class="bcw-stepper-node active" data-stage="1" role="tab" aria-selected="true" tabindex="0">
            <i class="fa-solid fa-users bcw-stepper-icon"></i>
            <span class="bcw-stepper-label" data-i18n="Characters">Characters</span>
        </div>
        <div class="bcw-stepper-line"></div>
        <div class="bcw-stepper-node" data-stage="2" role="tab" aria-selected="false" tabindex="0">
            <i class="fa-solid fa-bolt bcw-stepper-icon"></i>
            <span class="bcw-stepper-label" data-i18n="Generate">Generate</span>
        </div>
        <div class="bcw-stepper-line"></div>
        <div class="bcw-stepper-node" data-stage="3" role="tab" aria-selected="false" tabindex="0">
            <i class="fa-solid fa-wand-magic-sparkles bcw-stepper-icon"></i>
            <span class="bcw-stepper-label" data-i18n="Polish">Polish</span>
        </div>
        <div class="bcw-stepper-line"></div>
        <div class="bcw-stepper-node" data-stage="4" role="tab" aria-selected="false" tabindex="0">
            <i class="fa-solid fa-clipboard-check bcw-stepper-icon"></i>
            <span class="bcw-stepper-label" data-i18n="Review">Review</span>
        </div>
        <div class="bcw-stepper-line"></div>
        <div class="bcw-stepper-node" data-stage="5" role="tab" aria-selected="false" tabindex="0">
            <i class="fa-solid fa-image bcw-stepper-icon"></i>
            <span class="bcw-stepper-label" data-i18n="Avatar Studio">Avatar Studio</span>
        </div>
    </div>

    <!-- Stage content host: one panel per stage, only one visible at a time -->
    <div class="bcw-body">
        <div id="bcw_stage_1" class="bcw-stage active"></div>
        <div id="bcw_stage_2" class="bcw-stage" hidden></div>
        <div id="bcw_stage_3" class="bcw-stage" hidden></div>
        <div id="bcw_stage_4" class="bcw-stage" hidden></div>
        <div id="bcw_stage_5" class="bcw-stage" hidden></div>
    </div>

    <!-- Footer: action buttons -->
    <div class="bcw-footer" id="bcw_footer">
        <div id="bcw_btn_back" class="menu_button" hidden>
            <i class="fa-solid fa-chevron-left"></i>
            <span data-i18n="Back">Back</span>
        </div>
        <div id="bcw_btn_cancel" class="menu_button" data-i18n="Cancel">Cancel</div>
        <div id="bcw_btn_save_as_is" class="menu_button" hidden data-i18n="Save As Is">Save As Is</div>
        <div id="bcw_btn_next" class="menu_button" data-i18n="Generate">Generate</div>
    </div>
</div>
