<!--
    Stage 2 template — Generation Results.
    HTML fragment rendered into #bcw_stage_2 by Stage2Results.

    Sections:
      1. Integrated progress tracker (status, animated bar, count/ETA stats,
         collapsible token log, cancel button) — inline, not an overlay.
      2. Responsive result card grid (populated dynamically — one card per
         character with avatar, status badge, editable XML, parse status).
      3. Skip post-processing checkbox.
    See DESIGN doc (Stage 2) for layout details.
-->
<div class="bcw-stage2">

    <!-- 1. Progress tracker (integrated, not an overlay) -->
    <div class="bcw-progress" id="bcw_progress">
        <div class="bcw-progress-status" data-i18n="Starting...">Starting...</div>
        <div
            class="bcw-progress-bar"
            role="progressbar"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="0"
            aria-label="Generation progress"
        >
            <div class="bcw-progress-fill"></div>
        </div>
        <div class="bcw-progress-stats">
            <span class="bcw-progress-count">0/0</span>
            <span class="bcw-progress-eta">ETA: --</span>
        </div>
        <div class="bcw-progress-tokens" hidden></div>
        <div class="bcw-progress-cancel menu_button" id="bcw_progress_cancel" data-i18n="Cancel">Cancel</div>
    </div>

    <!-- 2. Result card grid (populated dynamically) -->
    <div class="bcw-result-grid" id="bcw_result_grid" role="list" aria-label="Generation results"></div>

    <!-- 3. Skip post-processing option -->
    <label class="checkbox_label" for="bcw_skip_postprocess">
        <input type="checkbox" id="bcw_skip_postprocess" />
        <span data-i18n="Skip post-processing">Skip post-processing</span>
    </label>

</div>
