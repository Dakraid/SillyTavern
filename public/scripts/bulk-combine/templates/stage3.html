<!--
    Stage 3 template — Polish (Post-Merge).
    HTML fragment rendered into #bcw_stage_3 by Stage3Polish.

    Sections:
      1. Prominent skip banner at the top (Stage 3 is optional).
      2. Post-merge prompt textarea with preset toolbar (mirrors Stage 1 prompt
         preset controls under the `bcw_postmerge_` ID prefix).
      3. Post-process mode selector — radio group (Replace / Prepend / Append).
      4. Before/after preview container (populated dynamically).
    See DESIGN doc (Stage 3) for layout details.
-->
<div class="bcw-stage3">

    <!-- 1. Skip banner — Stage 3 is optional -->
    <div class="bcw-skip-banner" id="bcw_polish_skip" role="button" tabindex="0">
        <i class="fa-solid fa-forward"></i>
        <span data-i18n="Skip this step">Skip this step</span>
    </div>

    <!-- 2. Post-merge prompt + preset toolbar -->
    <label for="bcw_postmerge_prompt" class="text_label">
        <span data-i18n="Prompt">Prompt</span>
        <textarea id="bcw_postmerge_prompt" class="text_pole" rows="12"></textarea>
    </label>
    <div class="bcw-preset-controls">
        <select id="bcw_postmerge_preset_select" class="text_pole">
            <option value="" data-i18n="— Load preset —">— Load preset —</option>
        </select>
        <div id="bcw_postmerge_preset_save" class="menu_button" title="Save preset" data-i18n="[title]Save preset">
            <i class="fa-solid fa-floppy-disk"></i>
        </div>
        <div id="bcw_postmerge_preset_delete" class="menu_button" title="Delete preset" data-i18n="[title]Delete preset">
            <i class="fa-solid fa-trash-can"></i>
        </div>
        <div id="bcw_postmerge_preset_restore" class="menu_button" title="Restore default" data-i18n="[title]Restore default">
            <i class="fa-solid fa-rotate-left"></i>
        </div>
    </div>

    <!-- 3. Post-process mode selector — radio group -->
    <div class="bcw-mode-selector">
        <span class="bcw-label" data-i18n="Mode">Mode</span>
        <div class="bcw-radio-group" id="bcw_postprocess_mode_group">
            <label class="checkbox_label">
                <input type="radio" name="bcw_postprocess_mode" value="replace" checked />
                <span data-i18n="Replace">Replace</span>
            </label>
            <label class="checkbox_label">
                <input type="radio" name="bcw_postprocess_mode" value="prepend" />
                <span data-i18n="Prepend">Prepend</span>
            </label>
            <label class="checkbox_label">
                <input type="radio" name="bcw_postprocess_mode" value="append" />
                <span data-i18n="Append">Append</span>
            </label>
        </div>
    </div>

    <!-- 4. Before/after preview container (populated dynamically) -->
    <div class="bcw-preview-container" id="bcw_postmerge_preview"></div>

</div>
